<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <rect x="0" y="0" width="32" height="32" fill="#c0c0c0"/>
  <!-- Black plate -->
  <rect x="3" y="6" width="26" height="22" fill="#1a1a1a"/>
  <rect x="3" y="6" width="26" height="1" fill="#3a3a3a"/>
  <rect x="3" y="6" width="1" height="22" fill="#3a3a3a"/>
  <rect x="28" y="6" width="1" height="22" fill="#000"/>
  <rect x="3" y="27" width="26" height="1" fill="#000"/>
  <!-- Big red 'D' -->
  <g fill="#cc0000">
    <rect x="9"  y="10" width="9" height="3"/>
    <rect x="9"  y="13" width="3" height="9"/>
    <rect x="15" y="13" width="3" height="9"/>
    <rect x="9"  y="22" width="9" height="3"/>
    <rect x="18" y="13" width="2" height="9"/>
    <rect x="18" y="11" width="2" height="2"/>
    <rect x="18" y="22" width="2" height="2"/>
  </g>
  <!-- Brighter red shine on top edge of D -->
  <rect x="9" y="10" width="9" height="1" fill="#ff4040"/>
  <rect x="9" y="10" width="1" height="13" fill="#ff4040"/>
</svg>
